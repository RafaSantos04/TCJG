name: tcjg

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      FAULT_INJECT: ${FAULT_INJECT:-none}
      DATABASE_URL: postgresql://tcjg:tcjg@postgres:5432/tcjg
      DB_POOL_MIN: 2
      DB_POOL_MAX: 10
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      OUTBOX_QUEUE_NAME: wallet-events.fifo
      OUTBOX_WORKER_ENABLED: 'true'
      OUTBOX_POLL_INTERVAL_MS: 500
      OUTBOX_LEASE_MS: 30000
      OUTBOX_BATCH_SIZE: 50
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
      OUTBOX_RETRY_JITTER: 0.2
      OUTBOX_MAX_ATTEMPTS: 10
      SQS_QUEUE_NAME: wager-transactions.fifo
      SQS_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_CONSUMER_NAME: tcjg-wager-consumer
      SQS_CONSUMER_ENABLED: 'true'
      SQS_WAIT_TIME_SECONDS: 20
      SQS_MAX_NUMBER_OF_MESSAGES: 10
      SQS_CONSUMER_CONCURRENCY: 10
      SQS_VISIBILITY_TIMEOUT_SECONDS: 30
      SQS_MAX_RECEIVE_COUNT: 5
      SQS_RETRY_BASE_SECONDS: 5
      SQS_RETRY_MAX_SECONDS: 300
      PENDING_REFERENCE_WORKER_ENABLED: 'true'
      PENDING_REFERENCE_POLL_INTERVAL_MS: 500
      PENDING_REFERENCE_INITIAL_DELAY_MS: 2000
      PENDING_REFERENCE_LEASE_MS: 30000
      PENDING_REFERENCE_BATCH_SIZE: 50
      PENDING_REFERENCE_RETRY_BASE_MS: 1000
      PENDING_REFERENCE_RETRY_MAX_MS: 300000
      PENDING_REFERENCE_MAX_ATTEMPTS: 10
    ports:
      - '3000-3002:3000'
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const response = await fetch('http://localhost:3000'); if (!response.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tcjg
      POSTGRES_USER: tcjg
      POSTGRES_PASSWORD: tcjg
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tcjg -d tcjg']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - localstack-data-v4:/var/lib/localstack
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:4566/_localstack/health > /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  localstack-init:
    image: localstack/localstack:4.14.0
    entrypoint: ['python', '/init/init_aws.py']
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_ENDPOINT: http://localstack:4566
    volumes:
      - ./docker/localstack/init_aws.py:/init/init_aws.py:ro
    depends_on:
      localstack:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  localstack-data-v4:
